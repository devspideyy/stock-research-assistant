[server]
address = "127.0.0.1"
port = 8517
headless = true
maxUploadSize = 30

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#62D9BB"
backgroundColor = "#111925"
secondaryBackgroundColor = "#192433"
textColor = "#E5EDF7"
font = "sans serif"
baseFontSize = 14
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "1rem", "1rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.7rem"
buttonRadius = "0.45rem"
borderColor = "#2A3749"
dataframeHeaderBackgroundColor = "#1D2A3C"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#62D9BB", "#8BAFFF", "#E5BC78", "#B7A2EC", "#EB8498"]

[theme.sidebar]
backgroundColor = "#0C131E"
secondaryBackgroundColor = "#182334"
textColor = "#CAD6E7"
primaryColor = "#62D9BB"
