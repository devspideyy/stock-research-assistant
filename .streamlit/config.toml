[server]
address = "127.0.0.1"
port = 8517
headless = true
maxUploadSize = 30

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#214B3C"
backgroundColor = "#F7F4EC"
secondaryBackgroundColor = "#EEEAE0"
textColor = "#253C32"
font = "sans serif"
headingFont = "serif"
baseFontSize = 15
headingFontSizes = ["2.65rem", "1.8rem", "1.35rem", "1.1rem", "1rem", "1rem"]
headingFontWeights = [500, 500, 500, 600, 600, 600]
baseRadius = "0.35rem"
buttonRadius = "0.25rem"
borderColor = "#D9D2C3"
dataframeHeaderBackgroundColor = "#E8E3D7"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#214B3C", "#B59254", "#697E91", "#A34D47", "#879388"]

[theme.sidebar]
backgroundColor = "#193D31"
secondaryBackgroundColor = "#254A3C"
textColor = "#F2EDDF"
primaryColor = "#376B54"
borderColor = "#496153"
