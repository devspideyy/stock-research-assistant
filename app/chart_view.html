<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;color:#253C32;background:#F7F4EC;font:12px 'Segoe UI',sans-serif}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
button{border:1px solid #D9D2C3;background:#FFFCF5;color:#214B3C;padding:6px 12px;border-radius:4px;cursor:pointer}
#legend{min-height:30px;line-height:1.6;margin:8px 0;color:#506257;font-variant-numeric:tabular-nums}
#chart{height:450px;border:1px solid #D9D2C3;border-radius:4px;overflow:hidden}
#fill{min-height:32px;margin-top:8px;line-height:1.5}footer{margin-top:8px;color:#607065;font-size:11px}a{color:#607065}
</style></head><body>
<div class="toolbar" aria-label="Research chart controls">
<button data-range="126">6M</button><button data-range="252">1Y</button><button data-range="1260">5Y</button><button data-range="all">All</button>
<label><input id="log" type="checkbox"> Log scale</label>
<label><input id="markers" type="checkbox" checked> Trade markers</label>
</div><div id="legend" aria-live="polite"></div><div id="chart" aria-label="Research candlestick chart"></div>
<div id="fill" aria-live="polite">Click a candle to inspect its executed fills. Pan or scroll to explore the record.</div>
<footer><a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView Lightweight Charts™</a> · Local research data · Copyright (с) 2025 TradingView, Inc.</footer>
<script>/* BUNDLED_LIBRARY */</script>
<script type="application/json" id="payload">/* PAYLOAD */</script>
<script>
// Presentation only: all indicators, fills and strategy decisions arrive from Python/C++.
try {
const p=JSON.parse(document.getElementById('payload').textContent), L=LightweightCharts;
const root=document.getElementById('chart'), legend=document.getElementById('legend');
const paneCount=Math.max(1,...p.lines.map(x=>x.pane))+1;
root.style.height=(450+Math.max(0,paneCount-2)*150)+'px';
const chart=L.createChart(root,{autoSize:true,layout:{background:{type:'solid',color:'#FFFCF5'},textColor:'#506257',fontFamily:'Segoe UI',attributionLogo:false},grid:{vertLines:{color:'#EEEAE0'},horzLines:{color:'#EEEAE0'}},timeScale:{borderColor:'#D9D2C3'},rightPriceScale:{borderColor:'#D9D2C3'},crosshair:{mode:L.CrosshairMode.Normal}});
const candles=chart.addSeries(L.CandlestickSeries,{upColor:'#317359',downColor:'#A34D47',borderVisible:false,wickUpColor:'#317359',wickDownColor:'#A34D47'});
candles.setData(p.bars);
chart.addSeries(L.HistogramSeries,{priceFormat:{type:'volume'},lastValueVisible:false},1).setData(p.volume);
const palette=['#B59254','#697E91','#317359','#A34D47'];
p.lines.forEach((line,i)=>{if(line.data.length) chart.addSeries(L.LineSeries,{color:palette[i%palette.length],lineWidth:1,title:line.name,lastValueVisible:false,priceLineVisible:false},line.pane).setData(line.data)});
chart.panes()[0].setHeight(330); chart.panes()[1].setHeight(110);
const marks=p.fills.map((t,i)=>({time:t.time,id:'fill-'+i,position:t.side==='BUY'?'belowBar':'aboveBar',color:t.side==='BUY'?'#214B3C':'#A34D47',shape:t.side==='BUY'?'arrowUp':'arrowDown',text:t.side+' @ '+Number(t.price).toFixed(2)}));
const markers=L.createSeriesMarkers(candles,marks);
const fmt=n=>Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function describe(bar){legend.textContent=p.symbol+' · '+bar.time+' · O '+fmt(bar.open)+'  H '+fmt(bar.high)+'  L '+fmt(bar.low)+'  C '+fmt(bar.close)}
describe(p.bars[p.bars.length-1]);
chart.subscribeCrosshairMove(e=>{const bar=e.seriesData.get(candles);if(bar)describe(bar)});
chart.subscribeClick(e=>{if(!e.time)return;const day=typeof e.time==='string'?e.time:typeof e.time==='number'?e.time:[e.time.year,String(e.time.month).padStart(2,'0'),String(e.time.day).padStart(2,'0')].join('-');const fills=p.fills.filter(t=>t.time===day);document.getElementById('fill').textContent=fills.length?fills.map(t=>t.side+' · '+day+' · '+fmt(t.quantity)+' units @ ₹'+fmt(t.price)+' · fee ₹'+fmt(t.fee||0)).join(' | '):day+' · No executed fills on this candle.'});
document.querySelectorAll('[data-range]').forEach(button=>button.onclick=()=>{if(button.dataset.range==='all')chart.timeScale().fitContent();else chart.timeScale().setVisibleLogicalRange({from:Math.max(0,p.bars.length-Number(button.dataset.range)),to:p.bars.length-1})});
document.getElementById('log').onchange=e=>chart.priceScale('right').applyOptions({mode:e.target.checked?L.PriceScaleMode.Logarithmic:L.PriceScaleMode.Normal});
document.getElementById('markers').onchange=e=>markers.setMarkers(e.target.checked?marks:[]);
chart.timeScale().setVisibleLogicalRange({from:Math.max(0,p.bars.length-252),to:p.bars.length-1});
} catch(error) {document.getElementById('legend').textContent='Chart could not render: '+error.message;}
</script></body></html>
